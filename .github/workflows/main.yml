name: Collaborative Workflow

on:
  push:
    branches:
      - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the respository
      - name: Checkout Respository
        uses: actions/checkout@v3

      
      # Step 2: update index.html
      - name: Update HTML
        run: |
          #Check if the github actor is D-Uni-UTS
          if [ "${{ github.actor }}" == "D-Uni-UTS" ]; then
            sed -i '/<\/body>/i <p>Updated by D-Uni-UTS on '"$(date)"'</p>' index.html
          fi
          
          # check if the github actor is Stephen-Tubb-UTS
          if [ "${{ github.actor }}" == "Stephen-Tubb-UTS" ]; then
            sed -i '/<\/body>/i <p>Updated by Stephen-Tubb-UTS on '"$(date)"'</p>' index.html
          fi

      # Step 3: Update README
      - name: Update README
        run: |
          echo "### Updated by $({ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md


      # Step 4: Commit changes back to the repository
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreplay.github.com"
          git add .
          git commit -m "Workflow: Updated HTML and README for ${{ github.actor }}"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
